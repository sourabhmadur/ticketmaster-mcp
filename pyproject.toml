[project]
name = "ticketmaster-mcp"
version = "0.1.0"
description = "MCP server exposing the Ticketmaster Discovery API: events, attractions, and venues"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ticketmaster-mcp = "ticketmaster_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketmaster_mcp"]
